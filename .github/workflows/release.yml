# A pushed tag `vX.Y.Z` publishes that version to npm, after the whole check passes on it. The tag
# must match `version` in package.json. Publishing uses npm's trusted publishing (OIDC): no token
# is stored; npmjs.com trusts this repository's `release.yml` to publish `hopgraph`, and the
# package carries a provenance statement linking it to this commit and this run. Then the
# version's CHANGELOG section becomes the GitHub Release.
#
# To release: `npm version patch|minor|major` (runs the check, stamps CHANGELOG.md and MIGRATION.md,
# commits and tags), then `git push --follow-tags`.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - name: The tag names the package's version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run check
      - run: npm publish
      - name: GitHub Release, with the version's CHANGELOG section
        run: |
          node tools/changelog.ts notes "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
